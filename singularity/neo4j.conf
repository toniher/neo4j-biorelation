#*****************************************************************
# Neo4j 5 configuration (biorelation unmanaged extension)
#
# In Neo4j 5 settings are namespaced (server.*, dbms.*, db.*). Many keys
# were renamed from the Neo4j 3.5/4.x `dbms.*` names. See:
# https://neo4j.com/docs/upgrade-migration-guide/current/version-5/changelogs/configuration-settings/
#*****************************************************************

# Paths of directories in the installation.
server.directories.data=/data
server.directories.plugins=plugins
server.directories.logs=/logs
server.directories.run=/run

# This setting constrains all `LOAD CSV` import files to be under the `import`
# directory. Comment it out to allow loading from anywhere in the filesystem.
# server.directories.import=import

# Whether requests to Neo4j are authenticated. Disabled for this read-only service.
dbms.security.auth_enabled=false

#*****************************************************************
# Network connector configuration
#*****************************************************************

# Accept non-local connections.
server.default_listen_address=0.0.0.0

# Bolt connector
server.bolt.enabled=true
#server.bolt.listen_address=:7687

# HTTP Connector.
server.http.enabled=true
#server.http.listen_address=:7474

# HTTPS Connector.
server.https.enabled=false
#server.https.listen_address=:7473

#*****************************************************************
# Unmanaged extension
#*****************************************************************

# Comma-separated list of JAX-RS packages, one package name for each mountpoint.
# Queries are served under /biodb (e.g. http://localhost:7474/biodb/helloworld).
server.unmanaged_extension_classes=cat.cau.neo4j.biorelation.rest=/biodb

#*****************************************************************
# APOC (used by the data-population scripts)
#*****************************************************************

dbms.security.procedures.unrestricted=apoc.*
apoc.import.file.enabled=true

#*****************************************************************
# Memory (tune to the host; these are examples)
#*****************************************************************

#server.memory.heap.initial_size=31g
#server.memory.heap.max_size=31g
#server.memory.pagecache.size=100g

# Retention policy for transaction logs.
db.tx_log.rotation.retention_policy=1 days

#*****************************************************************
# JVM parameters
#*****************************************************************

server.jvm.additional=-XX:-OmitStackTraceInFastThrow
server.jvm.additional=-XX:+AlwaysPreTouch
server.jvm.additional=-Djdk.tls.ephemeralDHKeySize=2048
server.jvm.additional=-Djdk.tls.rejectClientInitiatedRenegotiation=true
